apiVersion: v1
kind: Service
metadata:
  name: orders-api
  namespace: orderflow
spec:
  type: ClusterIP   # interno; el tráfico externo entra por un Ingress hacia el frontend (/api, /hubs)
  selector:
    app.kubernetes.io/name: orders-api
  ports:
    - name: http
      port: 8080
      targetPort: http
